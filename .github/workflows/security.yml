name: Security Scanning

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'Docs/Wireframe/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'Docs/Wireframe/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Audit root dependencies
        run: npm audit --audit-level=moderate

      - name: Audit frontend dependencies
        run: cd frontend && npm audit --audit-level=moderate

  cargo-audit:
    name: Cargo Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cargo Security Audit
        uses: actions-rust-lang/audit@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  secrets-scan:
    name: Secrets & Credentials Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependency Review and CodeQL code scanning both require GitHub Advanced Security, which isn't
  # available for private repositories on our plan — removed rather than left permanently red.
