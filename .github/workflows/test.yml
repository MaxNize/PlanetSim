name: CI Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'Docs/Wireframe/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'Docs/Wireframe/**'

jobs:
  build-wasm:
    name: Build WASM Module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM module
        run: cd wasm && wasm-pack build

      - name: Upload WASM package
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg/

  lint-and-format:
    name: Lint & Format Checks
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WASM package
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm --prefix frontend run lint

      - name: Run Prettier check
        run: cd frontend && npx prettier --check 'src/**/*.{ts,tsx,css}'

      - name: Run Stylelint
        run: cd frontend && npx stylelint 'src/**/*.css' || true

      - name: Run Markdownlint
        run: npm run lint:md

      - name: Run Max-lines check
        run: node scripts/check-max-lines.js --exceptions max-lines-exceptions.json

  code-quality:
    name: Code Quality Scans
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download WASM package
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Fallow code quality scan
        run: npm run check:fallow

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked

      - name: Run cargo-udeps
        run: npm run check:rust-udeps

  typescript-tests:
    name: TypeScript Tests & Coverage
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download WASM package
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: wasm/pkg/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Run tests with coverage
        run: cd frontend && npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error

  rust-tests:
    name: Rust Physics Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - name: Run Cargo Clippy
        run: cd wasm && cargo clippy --all-targets -- -D warnings

      - name: Run Cargo tests
        run: cd wasm && cargo test

      - name: Run doctests
        run: cd wasm && cargo test --doc

      - name: Build Cargo docs
        run: cd wasm && RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

      - name: Check Rust line count
        run: ./scripts/check_rust_line_count.sh
