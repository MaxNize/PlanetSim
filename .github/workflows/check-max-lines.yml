name: Check Max Lines

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  check-max-lines:
    runs-on: ubuntu-latest
    name: Verify 200-Line File Maximum

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install --save-dev minimatch@10.0.1 glob@11.0.0

      - name: Run max-lines check
        run: node scripts/check-max-lines.js --exceptions max-lines-exceptions.json
