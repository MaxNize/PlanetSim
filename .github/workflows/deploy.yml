name: Deploy via Self-Hosted Runner

on:
  workflow_run:
    workflows: [CI Pipeline]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build WASM Target
        run: cd wasm && cargo build --release --target wasm32-unknown-unknown

      - name: Build Frontend & WASM Release
        run: npm run build

      - name: Check WASM bundle size
        run: |
          echo "=== Checking WASM Bundle Sizes ==="
          wasm_files=$(find . -name "*.wasm" -not -path "*/node_modules/*" -not -path "*/target/debug/*")
          if [ -z "$wasm_files" ]; then
            echo "No WASM files found to check."
            exit 0
          fi
          
          for f in $wasm_files; do
            size=$(du -k "$f" | cut -f1)
            echo "File: $f, Size: ${size}KB"
            if [ "$size" -gt 500 ]; then
              echo "::warning file=$f::WASM bundle size exceeds 500KB target: ${size}KB"
            fi
          done

      - name: Deploy Application
        env:
          NPM_NETWORK_NAME: ${{ secrets.NPM_NETWORK_NAME }}
        run: |
          echo "Building and starting Docker container..."
          docker compose down
          docker compose up -d --build
          echo "Deployment completed successfully."
