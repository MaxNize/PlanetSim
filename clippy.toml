# clippy configuration (project-wide)
# Keep this file minimal unless a valid Clippy setting is needed.
#
# File-length exceptions are enforced by `scripts/check_rust_line_count.sh`.
# Known exceptions:
# - wasm/src/lib.rs
# - wasm/src/physics/mod.rs
# - wasm/src/physics/calculations.rs
# - wasm/src/physics/gravity.rs
# - wasm/src/wasm/mod.rs

# clippy::cognitive_complexity is a `nursery`-group lint (off by default) and is
# explicitly enabled via `#![warn(clippy::cognitive_complexity)]` in wasm/src/lib.rs.
# This is the Rust-side analog to Fallow's `complexity-hotspots` rule for the frontend.
cognitive-complexity-threshold = 25

